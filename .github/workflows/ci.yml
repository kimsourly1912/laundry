# Checks run on each pull request (spec §14: lint → typecheck → audit → tests, then e2e). A push to
# main (a merged pull request) only deploys to staging: GitHub tested the pull request merged into
# main, and main's branch rules require those checks to pass, and the branch to be up to date, before
# a merge (docs/server/operations.md → Staging). `workflow_dispatch` runs the checks on demand.
# E2E runs a production build against a seeded local database in the runner's preinstalled Google
# Chrome (test/e2e/support): no secrets. Setup follows https://pnpm.io/continuous-integration.
# Actions are pinned by full commit id: the deploy job holds the Cloudflare token.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow token can only read the repository: no job writes to GitHub.
permissions:
  contents: read

# A newer push to a pull request cancels its older run. On main, never: a cancel between the
# migrations and the Worker would leave staging half done.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read the project's Node.js requirement
        id: node
        run: |
          version=$(jq -er '.engines.node' package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Installs pnpm (packageManager) and Node (engines.node) from package.json, then `pnpm install`
      # (frozen lockfile in CI) with the store cached. Pinned by commit: v2.0.0.
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@${{ steps.node.outputs.version }}
          cache: true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Known advisories below "high" are accepted and reviewed when dependencies are updated.
      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high

      - name: Unit and server tests
        run: pnpm test:unit

  e2e:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read the project's Node.js requirement
        id: node
        run: |
          version=$(jq -er '.engines.node' package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@${{ steps.node.outputs.version }}
          cache: true

      - name: E2E tests
        run: pnpm test:e2e

  deploy-staging:
    # Only a push to main; pull requests never deploy. The build and the smoke check still stop a
    # broken deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: https://laundry-staging.angder.app
    # One deploy at a time, and a newer push never cancels one halfway (migrations, then Worker).
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_URL: https://laundry-staging.angder.app
    steps:
      - name: Check the Cloudflare secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (docs/server/operations.md → Staging)."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read the project's Node.js requirement
        id: node
        run: |
          version=$(jq -er '.engines.node' package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@${{ steps.node.outputs.version }}
          cache: true

      - name: Build the staging Worker
        run: pnpm build:staging

      # Before the new Worker: migrations are backwards compatible (expand, then contract), so the
      # old Worker keeps working against the migrated database for the moment in between.
      - name: Apply database migrations
        run: |
          if compgen -G ".output/server/db/migrations/sqlite/*.sql" > /dev/null; then
            pnpm db:migrate:staging
          else
            echo "No migrations yet."
          fi

      - name: Deploy the Worker
        run: pnpm exec wrangler deploy --config .output/server/wrangler.json

      - name: Smoke check
        run: |
          set -eu
          # The Worker answers and reaches its database. A new custom domain can take minutes to resolve: wait up to 5.
          curl --fail --silent --show-error --retry 30 --retry-delay 10 --retry-all-errors "$STAGING_URL/api/health" | grep -q '"ok"'
          # Better Auth answers (the Worker has its NUXT_BETTER_AUTH_SECRET): signed out is our JSON 401, not a 500.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$STAGING_URL/api/me")" = 401
          # An unknown API path is our JSON 404, not the app's HTML.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$STAGING_URL/api/does-not-exist")" = 404
          # The app shell loads with the security headers.
          curl --fail --silent --show-error --head "$STAGING_URL/" | grep -qi '^content-security-policy:'
          echo "Staging is up: $STAGING_URL"
